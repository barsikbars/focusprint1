<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1128">
<title>Цифровой психоанализ</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#7eb8da; --gold-light:#c5d9f0; --gold-dark:#2a4a7a;
  --maroon-deep:#0a1128; --cream:#e8eef8; --purple:#6b4c9a;
  --blue:#4a7ec7; --blue-light:#7eb8da; --sky:#a8d0f0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  background:var(--maroon-deep);color:var(--cream);
  font-family:Roboto,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 20% 10%,rgba(126,184,218,.10),transparent 40%),
    radial-gradient(circle at 80% 80%,rgba(107,76,154,.08),transparent 45%),
    repeating-conic-gradient(from 0deg at 50% 50%,rgba(126,184,218,.035) 0deg 15deg,transparent 15deg 30deg);
}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom));}
header{text-align:center;padding:8px 0 4px}
h1{font-family:'Roboto Slab',Georgia,serif;font-weight:700;font-size:22px;letter-spacing:1.5px;text-transform:uppercase;line-height:1.25;}
h1 .h1-line-1{color:var(--blue-light)}
h1 .h1-line-2{color:var(--gold-light)}
.divider{position:relative;display:flex;align-items:center;justify-content:center;height:1px;margin:18px 0 22px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--blue-light),transparent);}
.divider span{font-family:Roboto,sans-serif;font-size:12px;font-weight:400;color:var(--blue-light);background:var(--maroon-deep);padding:0 10px;position:relative;top:-1px;}
.form-card{position:relative;background:linear-gradient(145deg,rgba(26,42,94,.9),rgba(10,17,40,.95));border:1px solid var(--gold-dark);border-radius:14px;padding:22px 18px;margin-bottom:22px;box-shadow:0 2px 16px rgba(0,0,0,.35);}
.form-card::before{content:'';position:absolute;inset:5px;border:1px solid rgba(126,184,218,.2);border-radius:9px;pointer-events:none;}
.form-card label{display:block;font-family:'Roboto Slab',serif;font-weight:600;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue-light);margin-bottom:8px;}
.form-card input{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(126,184,218,.35);border-radius:8px;padding:12px 14px;color:var(--cream);font-family:'Roboto Slab',serif;font-size:20px;font-weight:700;letter-spacing:2px;text-align:center;margin-bottom:16px;outline:none;transition:border-color .25s,box-shadow .25s;-webkit-appearance:none;appearance:none;}
.form-card input::placeholder{color:rgba(197,217,240,.35);letter-spacing:2px;font-weight:400}
.form-card input:focus{border-color:var(--blue-light);box-shadow:0 0 0 3px rgba(126,184,218,.15);background:rgba(0,0,0,.45);}
.gender-switch{display:flex;gap:8px;margin-bottom:16px;}
.gender-btn{flex:1;padding:11px 8px;background:rgba(0,0,0,.3);border:1px solid rgba(126,184,218,.35);border-radius:8px;color:var(--cream);font-family:'Roboto Slab',serif;font-weight:600;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent;}
.gender-btn:hover{background:rgba(126,184,218,.1)}
.gender-btn.active{background:linear-gradient(135deg,var(--gold-dark),var(--blue));border-color:var(--blue-light);color:#fff;box-shadow:0 0 12px rgba(126,184,218,.35);}
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--gold-dark),var(--blue),var(--purple));color:var(--cream);border:0;border-radius:12px;padding:14px;font-family:'Roboto Slab',serif;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:2px;cursor:pointer;transition:filter .2s,transform .15s;-webkit-tap-highlight-color:transparent;}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.98)}
.loading{display:none;text-align:center;padding:40px 0;font-family:'Roboto Slab',serif;font-weight:600;color:var(--blue-light);letter-spacing:2px;font-size:12px;text-transform:uppercase;}
.loading.show{display:block}
.spinner{width:40px;height:40px;border:3px solid rgba(126,184,218,.2);border-top-color:var(--blue-light);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes resetIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#c-result{display:none}
#c-result.show{display:block;animation:fadeIn .5s ease}
.extra-block{background:linear-gradient(145deg,rgba(26,42,94,.85),rgba(10,17,40,.9));border:1px solid var(--gold-dark);border-radius:14px;padding:16px 14px;margin-bottom:16px;text-align:center;box-shadow:0 2px 16px rgba(0,0,0,.35);}
.extra-block .digits{font-family:'Roboto Slab',serif;font-weight:700;font-size:20px;color:var(--sky);letter-spacing:2px;text-shadow:0 0 15px rgba(126,184,218,.5);display:block;line-height:1.3;}
.extra-block .label{font-family:Roboto,sans-serif;font-weight:500;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--blue-light);display:block;margin-top:4px;}
.matrix-wrap{background:linear-gradient(145deg,rgba(26,42,94,.85),rgba(10,17,40,.9));border:1px solid var(--gold-dark);border-radius:14px;padding:12px 10px;margin-bottom:0;box-shadow:0 2px 16px rgba(0,0,0,.35);}
.matrix{border-collapse:separate;border-spacing:5px;width:100%;background:transparent;}
.matrix td{border:1px solid rgba(126,184,218,.2);padding:14px 4px;text-align:center;vertical-align:middle;background:rgba(0,0,0,.3);min-width:44px;border-radius:6px;transition:background .2s,border-color .2s;}
.matrix td.empty{background:rgba(0,0,0,.15);border-color:rgba(126,184,218,.1)}
.matrix .digit{font-family:'Roboto Slab',serif;font-size:20px;font-weight:700;color:var(--sky);display:block;line-height:1.3;letter-spacing:2px;word-break:break-all;text-shadow:0 0 10px rgba(126,184,218,.4);}
.matrix .label{font-family:Roboto,sans-serif;font-size:10px;font-weight:500;color:var(--blue-light);display:block;margin-top:4px;letter-spacing:.5px;text-transform:uppercase;}
.matrix td.empty .digit{color:rgba(126,184,218,.25);text-shadow:none}

#c-cells-sections{margin-top:16px;}

.section{background:linear-gradient(160deg,rgba(26,42,94,.85),rgba(10,17,40,.9));border:1px solid var(--gold-dark);border-radius:14px;margin-bottom:16px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.35);}
.section-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:linear-gradient(90deg,rgba(126,184,218,.12),transparent);border-bottom:1px solid rgba(126,184,218,.2);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;}
.section-header h2{font-family:'Roboto Slab',serif;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--gold-light);line-height:1.4;display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.section-header .chev{font-size:14px;color:var(--blue-light);transition:transform .3s ease;flex-shrink:0;margin-left:10px;}
.section.open .section-header .chev{transform:rotate(180deg)}
.section-body{max-height:0;overflow:hidden;transition:max-height .5s ease;}
.section.open .section-body{max-height:60000px}
.section-inner{padding:16px 18px 20px}
.section-inner p{font-family:Roboto,sans-serif;font-weight:400;font-size:15px;line-height:1.75;color:var(--cream);margin-bottom:14px;}
.section-inner p:last-child{margin-bottom:0}
.section-inner strong{font-family:Roboto,sans-serif;font-weight:400;color:var(--gold-light);}
.u{text-decoration:underline;text-underline-offset:2px;}
.section-num{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;border-radius:50%;border:1.5px solid currentColor;font-family:'Roboto Slab',serif;font-weight:600;font-size:12px;flex-shrink:0;line-height:1;padding:0;}
.toggle-btn{display:inline-block;background:rgba(126,184,218,.12);border:1px solid rgba(126,184,218,.4);border-radius:20px;padding:7px 16px;font-family:'Roboto Slab',serif;font-weight:600;font-size:12px;color:var(--gold-light);letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;margin-top:4px;transition:background .2s,border-color .2s;-webkit-tap-highlight-color:transparent;}
.toggle-btn:hover{background:rgba(126,184,218,.22);border-color:var(--blue-light)}
.full-desc{display:none;margin-top:14px;padding-top:14px;border-top:1px solid rgba(126,184,218,.2);}
.full-desc.open{display:block;animation:fadeIn .3s ease}

.types-spacer{display:none}
.method-title{
  font-family:'Roboto Slab',Georgia,serif;font-weight:700;font-size:22px;
  color:var(--gold-light);text-transform:uppercase;letter-spacing:1.5px;
  text-align:center;margin:16px 0;line-height:1.3;
}
.method-title span{color:var(--blue-light)}

.para-table{width:100%;border-collapse:collapse;margin-top:6px;font-family:Roboto,sans-serif;font-size:15px;}
.para-table th{background:rgba(126,184,218,.12);color:var(--gold-light);font-family:Roboto,sans-serif;font-weight:400;padding:8px 4px;text-align:center;border-bottom:1px solid rgba(126,184,218,.3);font-size:15px;letter-spacing:.5px;}
.para-table td{padding:9px 4px;color:var(--cream);border-bottom:1px solid rgba(126,184,218,.1);text-align:center;font-size:15px;font-family:Roboto,sans-serif;font-weight:400;}
.para-table tr:last-child td{border-bottom:none}
.para-table .point-label{color:var(--blue-light);font-family:Roboto,sans-serif;font-weight:400;font-size:15px;letter-spacing:.5px;}
.para-table .age-value{color:var(--sky);font-family:Roboto,sans-serif;font-weight:400;font-size:15px;}

.res-table{width:100%;border-collapse:collapse;margin-top:6px;font-family:Roboto,sans-serif;}
.res-table td{
  padding:11px 0;
  border-bottom:1px solid rgba(126,184,218,.12);
  vertical-align:middle;
}
.res-table tr:last-child td{border-bottom:none;}
.res-table .res-pair{width:62%;}
.res-table .res-age{
  width:38%;text-align:right;padding-right:6px;
  color:var(--sky);font-family:Roboto,sans-serif;
  font-weight:400;font-size:15px;white-space:nowrap;
  line-height:1.75;
}
.res-pair-line{
  display:flex;align-items:center;gap:10px;
  font-family:Roboto,sans-serif;font-weight:400;font-size:15px;
  color:var(--cream);line-height:1.75;
}
.res-pair-line.second{
  color:rgba(232,238,248,.78);
  font-size:15px;margin-top:4px;
}
.res-num{
  display:inline-flex;align-items:center;justify-content:center;
  width:23px;height:23px;border-radius:50%;border:1.4px solid;
  font-family:Roboto,sans-serif;font-weight:400;font-size:15px;
  flex-shrink:0;line-height:1;padding:0;
}
.resonance-empty{font-family:Roboto,sans-serif;font-size:15px;line-height:1.75;color:var(--cream);font-weight:400;}

/* ==== ГРАФИК ==== */
.chart-section .section-inner{padding:12px 10px 14px;}
.chart-svg{
  width:100%;
  height:auto;
  display:block;
  background:transparent;
  border-radius:0;
  shape-rendering:geometricPrecision;
  text-rendering:geometricPrecision;
}

/* ==== ЛЕГЕНДА: 2 ровных столбца ==== */
.chart-legend{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 16px;
  margin:16px 0 0;
  padding:0;
  width:100%;
  box-sizing:border-box;
}
.chart-legend-item{
  display:flex;align-items:center;
  gap:10px;
  font-family:Roboto,sans-serif;font-weight:400;
  font-size:15px;color:var(--cream);line-height:1.75;
  min-width:0;
}
.chart-legend-item > span:last-child{
  min-width:0;
  word-break:break-word;
}
.chart-legend-num{
  display:inline-flex;align-items:center;justify-content:center;
  width:23px;height:23px;border-radius:50%;border:1.4px solid;
  font-family:Roboto,sans-serif;font-weight:400;font-size:15px;
  flex-shrink:0;line-height:1;padding:0;
}

.reset-btn{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:50;padding:14px 30px;background:linear-gradient(135deg,var(--gold-dark),var(--blue),var(--purple));color:var(--cream);border:0;border-radius:12px;font-family:'Roboto Slab',serif;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:2px;cursor:pointer;display:none;transition:filter .2s,transform .15s;-webkit-tap-highlight-color:transparent;}
.reset-btn.show{display:block;animation:resetIn .4s ease}
.reset-btn:hover{filter:brightness(1.12)}
.reset-btn:active{transform:translateX(-50%) scale(.98)}

@media (max-width:400px){
  h1{font-size:19px}
  .extra-block .digits{font-size:18px}
  .form-card input{font-size:18px}
  .matrix td{padding:12px 3px;min-width:38px}
  .matrix .digit{font-size:18px}
  .matrix .label{font-size:9px}
  .section-header{padding:12px 14px}
  .section-inner{padding:14px 14px 18px}
  .section-inner p{font-size:14px}
  .method-title{font-size:19px}
  .para-table th{font-size:14px;padding:6px 2px}
  .para-table td{font-size:14px;padding:7px 2px}
  .para-table .point-label{font-size:14px}
  .para-table .age-value{font-size:14px}
  .chart-legend-item{font-size:14px}
  .res-table td{padding:9px 0}
  .res-pair-line{font-size:14px}
  .res-pair-line.second{font-size:14px}
  .res-table .res-age{font-size:14px}
  .res-num{font-size:14px}
  .chart-legend-num{font-size:14px}
  .resonance-empty{font-size:14px}
}
@media (max-width:340px){
  h1{font-size:17px}
  .form-card input{font-size:16px;letter-spacing:1.5px}
  .matrix .digit{font-size:16px}
  .matrix td{padding:10px 2px;min-width:34px}
  .extra-block .digits{font-size:16px}
  .section-inner p{font-size:13.5px}
  .method-title{font-size:17px}
  .para-table th{font-size:13.5px}
  .para-table td{font-size:13.5px}
  .para-table .point-label{font-size:13.5px}
  .para-table .age-value{font-size:13.5px}
  .chart-legend-item{font-size:13.5px}
  .res-pair-line{font-size:13.5px}
  .res-pair-line.second{font-size:13.5px}
  .res-table .res-age{font-size:13.5px}
  .res-num{font-size:13.5px}
  .chart-legend-num{font-size:13.5px}
  .resonance-empty{font-size:13.5px}
}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>
      <span class="h1-line-1">Цифровой</span><br>
      <span class="h1-line-2">психоанализ</span>
    </h1>
  </header>

  <div class="divider"><span>★</span></div>

  <div class="form-card">
    <label for="c-date">Дата рождения</label>
    <input type="text" id="c-date" placeholder="ДД.ММ.ГГГГ" value="14.06.1992" maxlength="10" inputmode="numeric" autocomplete="off">

    <label>Пол</label>
    <div class="gender-switch">
      <button type="button" class="gender-btn active" data-gender="m">Мужской</button>
      <button type="button" class="gender-btn" data-gender="f">Женский</button>
    </div>

    <button class="btn" id="c-calc-btn" type="button">Рассчитать</button>
  </div>

  <div class="loading" id="c-loading"><div class="spinner"></div>Расчёт матрицы…</div>

  <div id="c-result">
    <div class="extra-block">
      <div class="digits" id="c-extra-digits">—</div>
      <div class="label">Дополнительные числа</div>
    </div>

    <div class="matrix-wrap">
      <table class="matrix">
        <tr>
          <td id="c-1"><span class="digit">—</span><span class="label">Характер</span></td>
          <td id="c-4"><span class="digit">—</span><span class="label">Здоровье</span></td>
          <td id="c-7"><span class="digit">—</span><span class="label">Удача</span></td>
        </tr>
        <tr>
          <td id="c-2"><span class="digit">—</span><span class="label">Энергия</span></td>
          <td id="c-5"><span class="digit">—</span><span class="label">Логика</span></td>
          <td id="c-8"><span class="digit">—</span><span class="label">Долг</span></td>
        </tr>
        <tr>
          <td id="c-3"><span class="digit">—</span><span class="label">Интерес</span></td>
          <td id="c-6"><span class="digit">—</span><span class="label">Труд</span></td>
          <td id="c-9"><span class="digit">—</span><span class="label">Память</span></td>
        </tr>
      </table>
    </div>

    <div id="c-cells-sections"></div>
    <div id="c-lines-sections"></div>

    <div class="types-spacer"></div>
    <div class="method-title">Типы <span>мышления</span></div>
    <div id="c-types-sections"></div>

    <div class="types-spacer"></div>
    <div class="method-title">Метод <span>парабол</span></div>
    <div id="c-parabolas-sections"></div>
  </div>
</div>

<button class="reset-btn" id="c-reset-btn" type="button">Сбросить</button>

<script>
(function() {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) return;
  try {
    tg.ready(); tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#0a1128');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#0a1128');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  } catch (e) {}
})();

(function() {
  "use strict";

  var ONES_IMPORTANT = 'Характер — самая гибкая часть психоматрицы. Он меняется под влиянием обстоятельств, окружения и вашего собственного выбора.';
  var TWOS_IMPORTANT = 'Четвёрки способны компенсировать дефицит энергии — человек берёт силу из тела.';
  var THREES_IMPORTANT = 'Тройки показывают способ работы с информацией, но не определяют уровень интеллекта.';
  var FOURS_IMPORTANT = 'Четвёрки связаны с энергией через переход 22 ↔ 4.';
  var FIVES_IMPORTANT = 'Пятёрки — это инструмент. Сила логики зависит от применения.';
  var SIXES_IMPORTANT = 'Шестёрки показывают отношение к труду, но не гарантируют мастерства.';
  var SEVENS_IMPORTANT = 'Семёрки требуют пространства для свободного поиска.';
  var EIGHTS_IMPORTANT = 'Восьмёрки — это ответственность, но не жертвенность.';
  var NINES_IMPORTANT = 'Память — это инструмент, а не самоцель.';
  var LINE_GOAL_IMPORTANT = 'Целеустрем-сть определяется не только количеством, но и распределением цифр между ячейками.';
  var LINE_FAMILY_IMPORTANT = 'Линия семьи показывает значимость близких, но не гарантирует счастья.';
  var LINE_STABILITY_IMPORTANT = 'Стабильность — это не всегда хорошо.';
  var LINE_SELF_IMPORTANT = 'Самооценка всегда сравнивается со столбцом таланта.';
  var LINE_EVERYDAY_IMPORTANT = 'Сильный бытовой столбец без достаточной энергии и здоровья ведёт к надрыву.';
  var LINE_TALENT_IMPORTANT = 'Слабый столбец таланта не делает человека бесталанным.';
  var LINE_FLESHY_IMPORTANT = 'Темперамент описывает потребность и способ переживания близости.';
  var LINE_SPIRITUAL_IMPORTANT = 'Духовность оценивается не по заявлениям, а по уважению к чужой свободе.';

  function mkData(short,plus,minus,rec){return{short:short,plus:plus,minus:minus,rec:rec};}

  var onesZeroData=mkData(
    'От природы волевой стержень не выражен. Человеку комфортнее, когда рядом есть тот, кто берёт на себя ответственность.',

    h+='<div class="section-body"><div class="section-inner">';
    h+='<table class="para-table"><thead><tr><th>Точка</th><th>x</th><th>y</th><th>Возраст</th></tr></thead><tbody>';
    for(var i=0;i<params.levels.length;i++){
      var lv=params.levels[i];
      var xVal=lv.value;
      var yVal=y(xVal);
      var age=yVal*params.R;
      h+='<tr><td class="point-label">'+lv.short+'</td><td>'+formatNum3(xVal)+'</td><td>'+(Math.round(yVal*100)/100).toFixed(2).replace(/\.?0+$/,'')+'</td><td class="age-value">'+formatAge(age)+'</td></tr>';
    }
    h+='</tbody></table>';
    h+='</div></div></div>';
    return h;
  }

  function renderParabolasChart(counts,params){
    var lines=[];
    var maxEndAge=0;
    var maxLevel = params.lim;

    for(var i=0;i<PARABOLA_LINES.length;i++){
      var ln=PARABOLA_LINES[i];
      var a=counts[ln.cells[0]]||0;
      var b=counts[ln.cells[1]]||0;
      var c=counts[ln.cells[2]]||0;
      var endY=a*maxLevel*maxLevel+b*maxLevel+c;
      var endAge=endY*params.R;
      if(endAge>maxEndAge)maxEndAge=endAge;
      lines.push({a:a,b:b,c:c,name:ln.name,num:ln.num,endAge:endAge});
    }
    var maxAge = maxEndAge;
    if(maxAge < 20) maxAge = 20;
    if(maxAge > 130) maxAge = 130;

    var svgW=700, svgH=440;
    var padT=24, padB=46;
    var chartH=svgH-padT-padB;

    var PAD = 18;
    var LABEL_GAP = 6;
    var LABEL_MAX_WIDTH = 26;
    var padL = PAD + LABEL_MAX_WIDTH + LABEL_GAP;

    var CIRCLE_R = 11;
    var CIRCLE_FONT = 13;
    var AXIS_FONT = 13;

    var chartW = svgW - PAD - 2*CIRCLE_R - 4 - padL;

    var levels=params.levels;
    var nLevels=levels.length;

    function levelY(idx){
      if(nLevels===1)return padT+chartH/2;
      return padT + chartH - (idx/(nLevels-1))*chartH;
    }

    function valueToPy(x){
      if(x<=levels[0].value)return levelY(0);
      if(x>=levels[nLevels-1].value)return levelY(nLevels-1);
      for(var i=0;i<nLevels-1;i++){
        var v1=levels[i].value;
        var v2=levels[i+1].value;
        if(x>=v1 && x<=v2){
          var t=(v2-v1)>0 ? (x-v1)/(v2-v1) : 0;
          var y1=levelY(i);
          var y2=levelY(i+1);
          return y1+(y2-y1)*t;
        }
      }
      return levelY(0);
    }

    function toPx(age){return padL+(age/maxAge)*chartW;}

    var FONT_MID  ='font-family="Roboto, sans-serif" font-size="'+AXIS_FONT+'" text-anchor="middle"';
    var FONT_START='font-family="Roboto, sans-serif" font-size="'+AXIS_FONT+'" text-anchor="start"';
    var FONT_END  ='font-family="Roboto, sans-serif" font-size="'+AXIS_FONT+'" text-anchor="end"';

    var svg='<svg class="chart-svg" viewBox="0 0 '+svgW+' '+svgH+'" preserveAspectRatio="xMidYMid meet">';

    /* Горизонтальная фоновая сетка */
    for(var k=0;k<=4;k++){
      var py=padT+(k/4)*chartH;
      svg+='<line x1="'+padL+'" y1="'+py+'" x2="'+(padL+chartW)+'" y2="'+py+'" stroke="rgba(126,184,218,0.08)"/>';
    }

    /* Горизонтальная ось X */
    svg+='<line x1="'+padL+'" y1="'+(padT+chartH)+'" x2="'+(padL+chartW)+'" y2="'+(padT+chartH)+'" stroke="rgba(126,184,218,0.55)"/>';

    /* Горизонтальные уровни + подписи слева */
    for(var i=0;i<nLevels;i++){
      var lv=levels[i];
      var py=levelY(i);
      var isLim=(lv.label==='LIM');
      var isOver=/(У\.П\.)/.test(lv.label);
      var color = isLim ? 'rgba(155,127,212,0.85)' : (isOver ? 'rgba(155,127,212,0.6)' : 'rgba(168,208,240,0.6)');
      svg+='<line x1="'+padL+'" y1="'+py+'" x2="'+(padL+chartW)+'" y2="'+py+'" stroke="'+color+'" stroke-width="1" stroke-dasharray="3,3"/>';
      svg+='<text x="'+PAD+'" y="'+(py+AXIS_FONT*0.35)+'" fill="#7eb8da" '+FONT_START+'>'+lv.short+'</text>';
    }

    /* Кривые линий */
    var steps=140;
    for(var j=0;j<lines.length;j++){
      var ln=lines[j];
      var color=LINE_COLORS[j];
      var points=[];
      var endPx=0,endPy=0;
      var startX = params.min;

      for(var s=0;s<=steps;s++){
        var xVal = startX + (s/steps)*(maxLevel - startX);
        var yVal = ln.a*xVal*xVal + ln.b*xVal + ln.c;
        if(yVal<0)yVal=0;
        var age=yVal*params.R;
        if(age>maxAge)age=maxAge;
        var px=toPx(age);
        var py=valueToPy(xVal);
        points.push(px.toFixed(1)+','+py.toFixed(1));
        if(s===steps){endPx=px;endPy=py;}
      }

      svg+='<polyline points="'+points.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2" opacity="0.92" stroke-linejoin="round"/>';

      var cx = endPx + CIRCLE_R + 4;
      if (cx < padL + CIRCLE_R + 2) cx = padL + CIRCLE_R + 2;
      if (cx > svgW - CIRCLE_R - 2) cx = svgW - CIRCLE_R - 2;
      var cy = endPy;
      if (cy < padT + CIRCLE_R + 2) cy = padT + CIRCLE_R + 2;
      if (cy > svgH - CIRCLE_R - 2) cy = svgH - CIRCLE_R - 2;

      svg+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+CIRCLE_R+'" fill="#0a1128" stroke="'+color+'" stroke-width="1.6" shape-rendering="geometricPrecision"/>';
      svg+='<text x="'+cx.toFixed(1)+'" y="'+cy.toFixed(1)+'" fill="#c5d9f0" font-family="Roboto, sans-serif" font-size="'+CIRCLE_FONT+'" text-anchor="middle" dominant-baseline="central">'+ln.num+'</text>';
    }

    /* Возрастные метки снизу */
    var ageTicks = 9;
    for(var k=0;k<=ageTicks;k++){
      var ageTick=(k/ageTicks)*maxAge;
      var px=toPx(ageTick);
      var txtY = padT+chartH+AXIS_FONT+13;
      var anchor, txtX;
      if (k===0){ anchor='start'; txtX=padL; }
      else if (k===ageTicks){ anchor='end'; txtX=padL+chartW; }
      else { anchor='middle'; txtX=px; }
      svg+='<text x="'+txtX.toFixed(1)+'" y="'+txtY+'" fill="#7eb8da" font-family="Roboto, sans-serif" font-size="'+AXIS_FONT+'" text-anchor="'+anchor+'">'+Math.round(ageTick)+'</text>';
    }

    svg+='</svg>';

    var legendPadPct = (PAD/svgW*100).toFixed(3) + '%';
    var legend='<div class="chart-legend" style="padding:0 '+legendPadPct+';">';
    for (var li3=0; li3<PARABOLA_LINES.length; li3++){
      var ln3 = PARABOLA_LINES[li3];
      var clr3 = LINE_COLORS[li3];
      legend+='<div class="chart-legend-item"><span class="chart-legend-num" style="color:'+clr3+'; border-color:'+clr3+';">'+ln3.num+'</span><span>'+ln3.name+'</span></div>';
    }
    legend+='</div>';

    var h='';
    h+='<div class="section chart-section"><div class="section-header"><h2>★ График парабол</h2><span class="chev">▼</span></div>';
    h+='<div class="section-body"><div class="section-inner">';
    h+=svg;
    h+=legend;
    h+='</div></div></div>';
    return h;
  }

  function findIntersections(l1,l2,xMin,xMax){
    var a=l1.a-l2.a;
    var b=l1.b-l2.b;
    var c=l1.c-l2.c;
    var roots=[];
    if(Math.abs(a)<1e-9){
      if(Math.abs(b)>1e-9)roots.push(-c/b);
    } else {
      var D=b*b-4*a*c;
      if(D<-1e-9)return [];
      if(D<0)D=0;
      var sq=Math.sqrt(D);
      roots.push((-b+sq)/(2*a));
      if(sq>1e-9)roots.push((-b-sq)/(2*a));
    }
    var valid=[];
    for(var i=0;i<roots.length;i++){
      var x=roots[i];
      if(x>=xMin-1e-9&&x<=xMax+1e-9)valid.push(x);
    }
    var uniq=[];
    for(var i=0;i<valid.length;i++){
      var dup=false;
      for(var k=0;k<uniq.length;k++)if(Math.abs(uniq[k]-valid[i])<0.001){dup=true;break;}
      if(!dup)uniq.push(valid[i]);
    }
    return uniq;
  }

  function renderResonances(counts,params){
    var lineInfo=[];
    for(var i=0;i<PARABOLA_LINES.length;i++){
      var ln=PARABOLA_LINES[i];
      lineInfo.push({num:ln.num,name:ln.name,a:counts[ln.cells[0]]||0,b:counts[ln.cells[1]]||0,c:counts[ln.cells[2]]||0});
    }
    var pairs=[];
    var xMinRange=params.min;
    var xMaxRange=params.lim;
    for(var i=0;i<lineInfo.length;i++){
      for(var j=i+1;j<lineInfo.length;j++){
        var l1=lineInfo[i],l2=lineInfo[j];
        var xs=findIntersections(l1,l2,xMinRange,xMaxRange);
        for(var k=0;k<xs.length;k++){
          var x=xs[k];
          var yVal=l1.a*x*x+l1.b*x+l1.c;
          var age=yVal*params.R;
          if(age<0)continue;
          if(age>130)continue;
          pairs.push({l1:l1,l2:l2,x:x,age:age});
        }
      }
    }
    pairs.sort(function(p,q){return p.age-q.age;});

    var h='';
    h+='<div class="section"><div class="section-header"><h2>Резонансные точки</h2><span class="chev">▼</span></div>';
    h+='<div class="section-body"><div class="section-inner">';
    h+='<p>Резонансные точки — возрасты, в которых две линии пересекаются. В эти периоды два качества работают одновременно с одинаковой силой.</p>';

    if(pairs.length===0){
      h+='<p class="resonance-empty">На выбранном диапазоне (от '+formatNum3(xMinRange)+' до '+formatNum3(xMaxRange)+') резонансных пересечений линий не обнаружено.</p>';
    } else {
      var limit=Math.min(pairs.length,30);
      h+='<table class="res-table"><tbody>';
      for(var i=0;i<limit;i++){
        var p=pairs[i];
        var color1=LINE_COLORS[p.l1.num-1];
        var color2=LINE_COLORS[p.l2.num-1];
        h+='<tr>';
        h+='<td class="res-pair">';
        h+='<span class="res-pair-line"><span class="res-num" style="color:'+color1+'; border-color:'+color1+';">'+p.l1.num+'</span><span>'+p.l1.name+'</span></span>';
        h+='<span class="res-pair-line second"><span class="res-num" style="color:'+color2+'; border-color:'+color2+';">'+p.l2.num+'</span><span>'+p.l2.name+'</span></span>';
        h+='</td>';
        h+='<td class="res-age">'+formatAge(p.age)+'</td>';
        h+='</tr>';
      }
      h+='</tbody></table>';
      if(pairs.length>limit)h+='<p class="resonance-empty" style="margin-top:10px;">…и ещё '+(pairs.length-limit)+' пересечений.</p>';
    }

    h+='<button class="toggle-btn" type="button" style="margin-top:14px;">Как читать ▼</button>';
    h+='<div class="full-desc">';
    h+='<p><strong>Что показывает резонанс:</strong> возраст, в котором два качества работают одновременно.</p>';
    h+='<p><strong>Как использовать:</strong> если резонируют сильные линии — благоприятные окна. Противоположные — момент выбора.</p>';
    h+='<p><strong>Как устроено:</strong> решение системы a₁x²+b₁x+c₁ = a₂x²+b₂x+c₂. Возраст = y(x)·R.</p>';
    h+='</div>';
    h+='</div></div></div>';
    return h;
  }

  function buildParabolasSections(counts){
    var params=getLineParams(counts);
    var genderLabel=currentGender==='f'?'Женский':'Мужской';
    var h='';
    h+=renderParabolasIntro(params,genderLabel);
    h+=renderParabolasChart(counts,params);
    h+=renderResonances(counts,params);
    for(var i=0;i<PARABOLA_LINES.length;i++){
      var ln=PARABOLA_LINES[i];
      var a=counts[ln.cells[0]]||0;
      var b=counts[ln.cells[1]]||0;
      var c=counts[ln.cells[2]]||0;
      h+=renderParabolaBlock(ln,a,b,c,params);
    }
    return h;
  }

  function bindToggles(root){
    var buttons=root.querySelectorAll('.toggle-btn');
    for(var i=0;i<buttons.length;i++){
      (function(btn){
        btn.addEventListener('click',function(){
          var full=btn.parentNode.querySelector('.full-desc');
          if(!full)return;
          if(full.classList.contains('open')){full.classList.remove('open');btn.innerHTML='Подробнее ▼';}
          else{full.classList.add('open');btn.innerHTML='Подробнее ▲';}
        });
      })(buttons[i]);
    }
  }
  function bindSections(root){
    var headers=root.querySelectorAll('.section-header');
    for(var i=0;i<headers.length;i++){
      (function(h){
        h.addEventListener('click',function(){
          var section=h.parentNode;
          if(!section)return;
          section.classList.toggle('open');
        });
      })(headers[i]);
    }
  }

  function buildCellsSections(counts){
    var h='';
    for(var i=0;i<CELL_DATA.length;i++){
      var cell=CELL_DATA[i];
      var count=counts[cell.digit]||0;
      h+=renderCellSection(cell,count);
    }
    return h;
  }

  function buildLinesSections(counts){
    var h='';
    var keys=['goal','family','stability','selfEsteem','everyday','talent','fleshy','spiritual'];
    for(var i=0;i<keys.length;i++){
      var line=linesData[keys[i]];
      var count=getLineCount(counts,line.cells);
      h+=renderLineSection(line,count);
    }
    return h;
  }

  function calculate(){
    var inp=document.getElementById('c-date');
    var res=document.getElementById('c-result');
    var loading=document.getElementById('c-loading');
    var resetBtn=document.getElementById('c-reset-btn');
    var cellsHost=document.getElementById('c-cells-sections');
    var linesHost=document.getElementById('c-lines-sections');
    var typesHost=document.getElementById('c-types-sections');
    var parabolasHost=document.getElementById('c-parabolas-sections');
    if(!inp||!res)return;
    var parsed=parseDate(inp.value.trim());
    if(!parsed){alert('Введите дату в формате ДД.ММ.ГГГГ (например, 15.04.1972)');return;}
    var d=parsed.day,m=parsed.month,y=parsed.year;
    if(loading)loading.classList.add('show');
    res.classList.remove('show');
    if(resetBtn)resetBtn.classList.remove('show');
    setTimeout(function(){
      try{
        var extra=calcNumbers(d,m,y);
        var cnt=getCounts(d,m,y,extra);
        var absThird=Math.abs(extra.third);
        var absFourth=Math.abs(extra.fourth);
        document.getElementById('c-extra-digits').textContent=extra.first+' · '+extra.second+' · '+absThird+' · '+absFourth;
        for(var i=1;i<=9;i++){
          var cell=document.getElementById('c-'+i);
          if(!cell)continue;
          var disp=renderCount(cnt,i);
          var sp=cell.querySelector('.digit');
          if(sp)sp.textContent=disp;
          if(disp==='—')cell.classList.add('empty');else cell.classList.remove('empty');
        }
        cellsHost.innerHTML=buildCellsSections(cnt);
        linesHost.innerHTML=buildLinesSections(cnt);
        typesHost.innerHTML=buildTypesSections(d,m,y);
        parabolasHost.innerHTML=buildParabolasSections(cnt);
        bindSections(cellsHost);bindSections(linesHost);bindSections(typesHost);bindSections(parabolasHost);
        bindToggles(cellsHost);bindToggles(linesHost);bindToggles(typesHost);bindToggles(parabolasHost);
        res.classList.add('show');
        if(loading)loading.classList.remove('show');
        if(resetBtn)resetBtn.classList.add('show');
      }catch(e){
        if(loading)loading.classList.remove('show');
        alert('Ошибка: '+e.message);
        console.error(e);
      }
    },450);
  }

  function initInput(){
    var inp=document.getElementById('c-date');
    if(!inp)return;
    inp.addEventListener('input',function(){
      var v=this.value.replace(/[^0-9]/g,'');
      var f='';
      if(v.length>0)f+=v.substring(0,2);
      if(v.length>=3)f+='.'+v.substring(2,4);
      if(v.length>=5)f+='.'+v.substring(4,8);
      this.value=f;
    });
    inp.addEventListener('keydown',function(e){
      var allow=['Backspace','Delete','Tab','ArrowLeft','ArrowRight','Home','End'];
      if(allow.indexOf(e.key)!==-1)return;
      if(!/^[0-9]$/.test(e.key))e.preventDefault();
    });
  }
  function initGender(){
    var btns=document.querySelectorAll('.gender-btn');
    for(var i=0;i<btns.length;i++){
      (function(b){
        b.addEventListener('click',function(){
          for(var j=0;j<btns.length;j++)btns[j].classList.remove('active');
          b.classList.add('active');
          currentGender=b.getAttribute('data-gender')||'m';
          var res=document.getElementById('c-result');
          var inp=document.getElementById('c-date');
          if(res&&res.classList.contains('show')&&inp&&inp.value.trim().length===10)calculate();
        });
      })(btns[i]);
    }
  }
  function initReset(){
    var btn=document.getElementById('c-reset-btn');
    var inp=document.getElementById('c-date');
    var res=document.getElementById('c-result');
    var loading=document.getElementById('c-loading');
    var cellsHost=document.getElementById('c-cells-sections');
    var linesHost=document.getElementById('c-lines-sections');
    var typesHost=document.getElementById('c-types-sections');
    var parabolasHost=document.getElementById('c-parabolas-sections');
    if(!btn)return;
    btn.addEventListener('click',function(){
      if(res)res.classList.remove('show');
      if(loading)loading.classList.remove('show');
      if(cellsHost)cellsHost.innerHTML='';
      if(linesHost)linesHost.innerHTML='';
      if(typesHost)typesHost.innerHTML='';
      if(parabolasHost)parabolasHost.innerHTML='';
      if(inp)inp.value='';
      btn.classList.remove('show');
      window.scrollTo({top:0,behavior:'smooth'});
      setTimeout(function(){if(inp)inp.focus();},300);
    });
  }

  function init(){
    initInput();initGender();initReset();
    var btn=document.getElementById('c-calc-btn');
    if(btn)btn.addEventListener('click',calculate);
    setTimeout(calculate,150);
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>
